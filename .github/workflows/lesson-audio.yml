name: Render lesson audio
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sudo apt-get update && sudo apt-get install -y espeak-ng ffmpeg
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install kokoro==0.9.4 soundfile
      - shell: bash
        run: |
          set -o pipefail
          if [ -d docs/audio-review ]; then cp -a docs/audio-review audio-review; fi
          node scripts/lesson-audio.mjs | python scripts/render-audio.py audio-review
      - uses: actions/upload-artifact@v4
        with:
          name: introduce-yourself-audio
          path: audio-review/
          if-no-files-found: error
